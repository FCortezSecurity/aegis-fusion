name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -v

  security-scan:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security gate on project source
        run: python -m src.cli samples/vulnerable_app

      - name: Self-test, gate must fail on the vulnerable sample
        run: |
          set +e
          python -m src.cli samples/vulnerable_app
          code=$?
          echo "Aegis exit code: $code"
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 (policy failure), got $code"
            exit 1
          fi
          echo "Gate correctly failed on the intentionally vulnerable sample"