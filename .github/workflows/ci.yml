name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -v

  security-scan:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-pull scanner images (with retries)
        run: |
          for image in zricethezav/gitleaks:latest bridgecrew/checkov:latest aquasec/trivy:latest; do
            for attempt in 1 2 3 4; do
              if docker pull "$image"; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Could not pull $image after 4 attempts"
                exit 1
              fi
              echo "Pull of $image failed (attempt $attempt), retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
          done

      - name: Security gate on project source
        run: python -m src.cli src --json reports/source.json --markdown reports/source.md

      - name: Self-test, gate must fail on the vulnerable sample
        run: |
          set +e
          python -m src.cli samples/vulnerable_app --json reports/sample.json --markdown reports/sample.md
          code=$?
          echo "Aegis exit code: $code"
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 (policy failure), got $code"
            exit 1
          fi
          echo "Gate correctly failed on the intentionally vulnerable sample"

      - name: Show reports on the run summary
        if: always()
        run: |
          for f in reports/source.md reports/sample.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-reports
          path: reports/
          if-no-files-found: warn